# =============================================================================
# Brane OS — GRUB boot configuration
# =============================================================================
# Placed at: iso_root/boot/grub/grub.cfg
# This file is embedded inside the ISO by grub-mkrescue.
# =============================================================================

set default=0
set timeout=5

# Color scheme
set menu_color_normal=cyan/black
set menu_color_highlight=white/blue

menuentry "Brane OS (BIOS)" {
    echo "Loading Brane OS..."
    # The BIOS raw image is embedded as El Torito — GRUB chainloads it.
    # When using xorriso El Torito directly this entry is not used;
    # it is active when grub-mkrescue wraps the image.
    insmod part_msdos
    insmod chain
    chainloader /boot/brane_os.img
}

menuentry "Brane OS (BIOS) — serial debug" {
    echo "Loading Brane OS with serial debug..."
    insmod part_msdos
    insmod chain
    chainloader /boot/brane_os.img
    # Note: serial redirect is configured in the kernel itself (COM1, 115200).
}
