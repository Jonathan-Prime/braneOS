name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (for validation only)"
        required: true
        default: "1.0.0-rc1"

permissions:
  contents: write

jobs:
  package:
    name: Package and verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=${{ inputs.version }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tag-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tag-release-
            ${{ runner.os }}-release-
            ${{ runner.os }}-cargo-

      - name: Install release dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso

      - name: Build and boot-test artifacts
        env:
          BOOT_TIMEOUT: "90"
        run: make release-test VERSION=${{ steps.version.outputs.value }}

      - name: Verify SHA-256 checksum
        working-directory: dist
        run: sha256sum --check brane_os_v${{ steps.version.outputs.value }}.iso.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: brane-os-v${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Brane OS ${GITHUB_REF_NAME}"
