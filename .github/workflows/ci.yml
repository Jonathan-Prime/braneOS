# ============================================================
# Brane OS — CI Pipeline (GitHub Actions)
# ============================================================
# Runs on every push and pull request to main.
# Validates:
#   1. Kernel compiles for x86_64-unknown-none
#   2. Code formatting (rustfmt)
#   3. Lints (clippy)
#   4. Kernel unit tests
#   5. Boot test — QEMU serial output verification (60 s timeout)
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # -----------------------------------------------------------------
  # Build — compile the kernel for bare-metal x86_64
  # -----------------------------------------------------------------
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (debug)
        run: cargo build -p brane_os_kernel --target x86_64-unknown-none

      - name: Build (release)
        run: cargo build -p brane_os_kernel --target x86_64-unknown-none --release

  # -----------------------------------------------------------------
  # Format — check code formatting with rustfmt
  # -----------------------------------------------------------------
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # -----------------------------------------------------------------
  # Clippy — lint checks
  # -----------------------------------------------------------------
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: clippy, rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-

      - name: Run Clippy
        run: cargo clippy -p brane_os_kernel --target x86_64-unknown-none -- -D warnings

      - name: Run Runner Clippy
        run: cargo clippy -p runner --all-targets -- -D warnings

  # -----------------------------------------------------------------
  # Tests — host-side unit tests for kernel logic
  # -----------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rust-src

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tests-

      - name: Run kernel unit tests
        run: cargo test -p brane_os_kernel --lib

  # -----------------------------------------------------------------
  # Boot Test — run Brane OS in QEMU and verify serial output
  # -----------------------------------------------------------------
  boot-test:
    name: Boot Test (QEMU)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-11
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-boot-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-boot-

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Run boot test
        timeout-minutes: 5
        env:
          BOOT_TIMEOUT: "60"
        run: python3 tests/boot/test_boot.py
